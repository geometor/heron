name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Deploy Docs
        uses: photon-platform/action-deploy-sphinx-gh-pages@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          python_version: '3.13'
          modules_repo_urls: 'https://github.com/geometor/model.git,https://github.com/geometor/divine.git,https://github.com/geometor/heron.git'
