<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" width="680" height="460" viewBox="0 0 680 460" data-graphic-id="g1" role="img" aria-label="Hero Metrica I.18 Lemma — Pentagon Golden Section Identity (BA + AC)^2 = 5 AC^2">
  <title>Hero Metrica I.18 Lemma — Pentagon Golden Section Identity (BA + AC)^2 = 5 AC^2</title>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" orient="auto" markerUnits="userSpaceOnUse">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="var(--geom-assert, #059669)"
            stroke-width="2" stroke-linecap="round" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" orient="auto" markerUnits="userSpaceOnUse">
      <line x1="-2" y1="-4.5" x2="-2" y2="4.5" stroke="var(--geom-assert, #059669)"
            stroke-width="2" stroke-linecap="round" />
      <line x1="2" y1="-4.5" x2="2" y2="4.5" stroke="var(--geom-assert, #059669)"
            stroke-width="2" stroke-linecap="round" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" orient="auto" markerUnits="userSpaceOnUse">
      <line x1="-3.5" y1="-4.5" x2="-3.5" y2="4.5" stroke="var(--geom-assert, #059669)"
            stroke-width="1.8" stroke-linecap="round" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="var(--geom-assert, #059669)"
            stroke-width="1.8" stroke-linecap="round" />
      <line x1="3.5" y1="-4.5" x2="3.5" y2="4.5" stroke="var(--geom-assert, #059669)"
            stroke-width="1.8" stroke-linecap="round" />
    </marker>
  </defs>
  <style>
.euclid-graphic {
    --svg-bg: #fafaf9;
    --geom-bg: #fafaf9;
    --ink: #1c1917;
    --geom-fg: #1c1917;
    --geom-accent: #d97706;
    --geom-assert: #059669;
    --label-halo: rgba(250, 250, 249, 0.92);
    --carrier: #334155;
    --conic: #0284c7;
    --cyclic: #7c3aed;
    --bisector: #0f766e;
    --aux: #64748b;
    --golden: #b45309;
    --tangent: #0369a1;
    --radius-col: #059669;
    --pt-given: #0f172a;
    --pt-incenter: #d97706;
    --pt-touch: #0284c7;
    --pt-meet: #7c3aed;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .euclid-graphic {
      --svg-bg: #141417;
      --geom-bg: #141417;
      --ink: #f4f4f5;
      --geom-fg: #f4f4f5;
      --geom-accent: #fbbf24;
      --geom-assert: #34d399;
      --label-halo: rgba(20, 20, 23, 0.92);
      --carrier: #cbd5e1;
      --conic: #38bdf8;
      --cyclic: #c084fc;
      --bisector: #2dd4bf;
      --aux: #94a3b8;
      --golden: #facc15;
      --tangent: #38bdf8;
      --radius-col: #34d399;
      --pt-given: #f1f5f9;
      --pt-incenter: #fbbf24;
      --pt-touch: #38bdf8;
      --pt-meet: #c084fc;
    }
  }
  .euclid-graphic .svg-bg { fill: var(--svg-bg); }
  .euclid-graphic .geom-circle.incircle-curve {
    fill: none; stroke: var(--conic); stroke-width: 2.25; opacity: 0.92;
  }
  .euclid-graphic .geom-circle.cyclic-curve {
    fill: none; stroke: var(--cyclic); stroke-width: 1.75;
    stroke-dasharray: 6 4; opacity: 0.78;
  }
  .euclid-graphic .geom-circle.golden-curve {
    fill: none; stroke: var(--golden); stroke-width: 1.9;
    stroke-dasharray: 5 3.5; opacity: 0.85;
  }
  .euclid-graphic .geom-line {
    fill: none; stroke: var(--aux); stroke-width: 1.35;
    stroke-linecap: round; opacity: 0.72;
  }
  .euclid-graphic .carrier-line { stroke: var(--carrier); stroke-width: 2.05; opacity: 0.92; }
  .euclid-graphic .bisector-line { stroke: var(--bisector); stroke-width: 1.85; opacity: 0.88; }
  .euclid-graphic .aux-line {
    stroke: var(--aux); stroke-width: 1.35; stroke-dasharray: 5 3.5; opacity: 0.75;
  }
  .euclid-graphic .quad-line { stroke: var(--cyclic); stroke-width: 1.75; opacity: 0.85; }
  .euclid-graphic .geom-segment {
    fill: none; stroke: var(--tangent); stroke-width: 2.5;
    stroke-linecap: round; opacity: 0.85;
  }
  .euclid-graphic .geom-segment.golden-segment {
    stroke: var(--golden); stroke-width: 3.3; opacity: 0.92;
  }
  .euclid-graphic .geom-segment.radius-segment {
    stroke: var(--radius-col); stroke-width: 2.3; opacity: 0.9;
  }
  .euclid-graphic .geom-segment.semi-segment {
    stroke: var(--carrier); stroke-width: 2.4; opacity: 0.82;
  }
  .euclid-graphic .geom-polygon.tri-poly {
    fill: var(--conic); fill-opacity: 0.06;
    stroke: var(--carrier); stroke-width: 1.9; stroke-linejoin: round;
  }
  .euclid-graphic .geom-polygon.cyclic-poly {
    fill: var(--cyclic); fill-opacity: 0.07;
    stroke: var(--cyclic); stroke-width: 1.6; stroke-linejoin: round;
  }
  .euclid-graphic .geom-polygon.quad-poly {
    fill: var(--golden); fill-opacity: 0.07;
    stroke: var(--golden); stroke-width: 1.6; stroke-linejoin: round;
  }
  .euclid-graphic .geom-point { fill: var(--pt-given); stroke: var(--svg-bg); stroke-width: 1.5; }
  .euclid-graphic .incenter-point { fill: var(--pt-incenter); stroke-width: 1.8; }
  .euclid-graphic .touch-point { fill: var(--pt-touch); }
  .euclid-graphic .meet-point { fill: var(--pt-meet); }
  .euclid-graphic .golden-point { fill: var(--golden); stroke-width: 1.8; }
  .euclid-graphic .geom-label {
    fill: var(--ink);
    font-size: 13.5px;
    font-weight: 600;
    paint-order: stroke fill;
    stroke: var(--label-halo);
    stroke-width: 3.6px;
    stroke-linejoin: round;
    user-select: none;
  }
  .euclid-graphic .geom-label-sub { font-size: 10px; font-weight: 600; }
  </style>
  <rect class="svg-bg" x="0" y="0" width="680" height="460" rx="6" />
  <g id="elements">
    <g id="graphics">
      <polygon class="geom-polygon tri-poly" points="293.15,230 415.81,140.88 538.46,230" data-ref="&lt; A B D &gt;" />
      <circle class="geom-circle golden-curve" cx="293.15" cy="230" r="151.61" data-ref="( A B )" data-aliases="( A G )" fill="none"><title>( A B ): y**2 + (x + 1)**2 - 6 + 2*sqrt(5) = 0</title></circle>
      <path class="geom-line carrier-line" d="M 14 230 L 340 230 L 666 230" data-ref="[ A C ]" data-aliases="[ C A ] | [ A D ] | [ D A ] | [ A G ] | [ G A ] | [ C D ] | [ D C ] | [ C G ] | [ G C ] | [ D G ] | [ G D ]" fill="none"><title>[ A C ]: y = 0</title></path>
      <path class="geom-line carrier-line" d="M 415.81 446 L 415.81 230 L 415.81 14" data-ref="[ B E ]" data-aliases="[ C B ] | [ B C ]" fill="none"><title>[ B E ]: x = 0</title></path>
      <path class="geom-line carrier-line" d="M 14 432.81 L 302.22 223.41 L 590.45 14" data-ref="[ A B ]" data-aliases="[ B A ]" fill="none"><title>[ A B ]: -x*sqrt(5 - 2*sqrt(5)) + y - sqrt(5 - 2*sqrt(5)) = 0</title></path>
      <path class="geom-line carrier-line" d="M 666 322.66 L 453.58 168.33 L 241.17 14" data-ref="[ B D ]" data-aliases="[ D B ]" fill="none"><title>[ B D ]: x*sqrt(5 - 2*sqrt(5)) + y - sqrt(5 - 2*sqrt(5)) = 0</title></path>
      <path class="geom-segment golden-segment" d="M 293.15 230 L 368.96 230 L 444.76 230" data-ref="/ A G /" data-aliases="/ G A /" fill="none"><title>/ A G /: |seg| = -1 + sqrt(5)</title></path>
      <path class="geom-segment golden-segment" d="M 293.15 230 L 354.48 185.44 L 415.81 140.88" data-ref="/ A B /" data-aliases="/ B A /" fill="none"><title>/ A B /: |seg| = sqrt(6 - 2*sqrt(5))</title></path>
      <path class="geom-segment golden-segment" d="M 415.81 140.88 L 477.14 185.44 L 538.46 230" data-ref="/ B D /" data-aliases="/ D B /" fill="none"><title>/ B D /: |seg| = sqrt(6 - 2*sqrt(5))</title></path>
      <path class="geom-segment" d="M 293.15 230 L 354.48 230 L 415.81 230" data-ref="/ A C /" data-aliases="/ C A /" fill="none"><title>/ A C /: |seg| = 1</title></path>
      <path class="geom-segment" d="M 415.81 230 L 477.14 230 L 538.46 230" data-ref="/ C D /" data-aliases="/ D C /" fill="none"><title>/ C D /: |seg| = 1</title></path>
    </g>
    <g id="highlights" style="pointer-events: none;"></g>
    <g id="points">
      <circle class="geom-point" cx="293.15" cy="230" r="4.3" data-ref="A" data-latex-x="-1" data-latex-y="0"><title>A = (-1, 0)</title></circle>
      <circle class="geom-point" cx="415.81" cy="230" r="4.3" data-ref="C" data-latex-x="0" data-latex-y="0"><title>C = (0, 0)</title></circle>
      <circle class="geom-point" cx="538.46" cy="230" r="4.3" data-ref="D" data-latex-x="1" data-latex-y="0"><title>D = (1, 0)</title></circle>
      <circle class="geom-point golden-point" cx="415.81" cy="140.88" r="4.6" data-ref="B" data-latex-x="0" data-latex-y="\sqrt{5 - 2 \sqrt{5}}"><title>B = (0, sqrt(5 - 2*sqrt(5)))</title></circle>
      <circle class="geom-point golden-point" cx="444.76" cy="230" r="4.6" data-ref="G" data-latex-x="-1 + \sqrt{2} \left(- \frac{\sqrt{2}}{2} + \frac{\sqrt{10}}{2}\right)" data-latex-y="0"><title>G = (-1 + sqrt(2)*(-sqrt(2)/2 + sqrt(10)/2), 0)</title></circle>
    </g>
    <g id="labels">
      <text class="geom-label" x="287.21" y="215.46" data-ref="A">A</text>
      <text class="geom-label" x="422.88" y="219.89" data-ref="C">C</text>
      <text class="geom-label" x="532.52" y="215.46" data-ref="D">D</text>
      <text class="geom-label" x="430.59" y="145.64" data-ref="B">B</text>
      <text class="geom-label" x="438.82" y="215.16" data-ref="G">G</text>
    </g>
  </g>
</svg>
