      <circle class="geom-point" cx="461.83" cy="82.26" r="4.3" data-ref="D" data-latex-x="10" data-latex-y="6"><title>D = (10, 6)</title></circle>
      <circle class="geom-point" cx="377.96" cy="250" r="4.3" data-ref="Z" data-latex-x="7" data-latex-y="0"><title>Z = (7, 0)</title></circle>
