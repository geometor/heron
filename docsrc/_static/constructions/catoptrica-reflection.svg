      <path class="geom-line aux-line" d="M 461.83 486 L 461.83 250 L 461.83 14" data-ref="[ D F ]" data-aliases="[ D H ] | [ H D ] | [ D K ] | [ K D ] | [ H K ] | [ K H ]" fill="none"><title>[ D F ]: x - 10 = 0</title></path>
      <path class="geom-line bisector-line" d="M 530.09 486 L 294.09 250 L 58.09 14" data-ref="[ C K ]" data-aliases="[ K C ] | [ C E ] | [ E C ] | [ K E ] | [ E K ]" fill="none"><title>[ C K ]: 9*x + 9*y - 36 = 0</title></path>
      <path class="geom-line bisector-line" d="M 58.09 486 L 294.09 250 L 530.09 14" data-ref="[ E D ]" data-aliases="[ D E ]" fill="none"><title>[ E D ]: -6*x + 6*y + 24 = 0</title></path>
      <path class="geom-segment golden-segment" d="M 210.22 166.13 L 252.15 208.06 L 294.09 250" data-ref="/ C E /" data-aliases="/ E C /" fill="none"><title>/ C E /: |seg| = 3*sqrt(2)</title></path>
      <path class="geom-segment golden-segment" d="M 294.09 250 L 377.96 166.13 L 461.83 82.26" data-ref="/ E D /" data-aliases="/ D E /" fill="none"><title>/ E D /: |seg| = 6*sqrt(2)</title></path>
      <path class="geom-segment golden-segment" d="M 294.09 250 L 377.96 333.87 L 461.83 417.74" data-ref="/ E K /" data-aliases="/ K E /" fill="none"><title>/ E K /: |seg| = 6*sqrt(2)</title></path>
      <path class="geom-segment" d="M 210.22 166.13 L 294.09 208.06 L 377.96 250" data-ref="/ C Z /" data-aliases="/ Z C /" fill="none"><title>/ C Z /: |seg| = 3*sqrt(5)</title></path>
      <path class="geom-segment" d="M 377.96 250 L 419.89 166.13 L 461.83 82.26" data-ref="/ Z D /" data-aliases="/ D Z /" fill="none"><title>/ Z D /: |seg| = 3*sqrt(5)</title></path>
      <path class="geom-segment" d="M 377.96 250 L 419.89 333.87 L 461.83 417.74" data-ref="/ Z K /" data-aliases="/ K Z /" fill="none"><title>/ Z K /: |seg| = 3*sqrt(5)</title></path>
      <path class="geom-segment radius-segment" d="M 461.83 82.26 L 461.83 166.13 L 461.83 250" data-ref="/ D H /" data-aliases="/ H D /" fill="none"><title>/ D H /: |seg| = 6</title></path>
      <path class="geom-segment radius-segment" d="M 461.83 250 L 461.83 333.87 L 461.83 417.74" data-ref="/ H K /" data-aliases="/ K H /" fill="none"><title>/ H K /: |seg| = 6</title></path>
    </g>
