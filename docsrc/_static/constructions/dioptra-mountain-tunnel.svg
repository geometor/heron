    --cyclic: #7c3aed;
    --bisector: #0f766e;
    --aux: #64748b;
    --golden: #b45309;
    --tangent: #0369a1;
    --radius-col: #059669;
    --pt-given: #0f172a;
    --pt-incenter: #d97706;
    --pt-touch: #0284c7;
    --pt-meet: #7c3aed;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
