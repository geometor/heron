      <circle class="geom-circle golden-curve" cx="300.32" cy="220" r="143.55" data-ref="( M C )" data-aliases="( M D ) | ( M E ) | ( M E1 ) | ( D C E )" fill="none"><title>( M C ): y**2 + (x - 1/2)**2 - 5/4 = 0</title></circle>
      <circle class="geom-circle incircle-curve" cx="443.87" cy="220" r="79.35" data-ref="( E B )" data-aliases="( E G )" fill="none"><title>( E B ): y**2 + (x - sqrt(5)/2 - 1/2)**2 - (-1/2 + sqrt(5)/2)**2 = 0</title></circle>
      <path class="geom-line carrier-line" d="M 14 220 L 340 220 L 666 220" data-ref="[ A B ]" data-aliases="[ B A ] | [ A M ] | [ M A ] | [ A E ] | [ E A ] | [ A E1 ] | [ E1 A ] | [ B M ] | [ M B ] | [ B E ] | [ E B ] | [ B E1 ] | [ E1 B ] | [ M E ] | [ E M ] | [ M E1 ] | [ E1 M ] | [ E E1 ] | [ E1 E ]" fill="none"><title>[ A B ]: y = 0</title></path>
      <path class="geom-line carrier-line" d="M 236.13 426 L 236.13 220 L 236.13 14" data-ref="[ D E ]" data-aliases="[ A D ] | [ D A ]" fill="none"><title>[ D E ]: x = 0</title></path>
      <path class="geom-line carrier-line" d="M 364.52 426 L 364.52 220 L 364.52 14" data-ref="[ G H ]" data-aliases="[ B C ] | [ C B ] | [ B H ] | [ H B ] | [ C H ] | [ H C ]" fill="none"><title>[ G H ]: x - 1 = 0</title></path>
      <path class="geom-line carrier-line" d="M 14 91.61 L 340 91.61 L 666 91.61" data-ref="[ D C ]" data-aliases="[ C D ] | [ D F ] | [ F D ] | [ C F ] | [ F C ]" fill="none"><title>[ D C ]: y - 1 = 0</title></path>
      <path class="geom-line carrier-line" d="M 443.87 426 L 443.87 220 L 443.87 14" data-ref="[ P Q ]" data-aliases="[ E F ] | [ F E ] | [ E G ] | [ G E ] | [ F G ] | [ G F ]" fill="none"><title>[ P Q ]: x - sqrt(5)/2 - 1/2 = 0</title></path>
      <path class="geom-line bisector-line" d="M 14 140.65 L 340 140.65 L 666 140.65" data-ref="[ U V ]" data-aliases="[ G H ] | [ H G ]" fill="none"><title>[ U V ]: y - sqrt(5)/2 + 1/2 = 0</title></path>
      <path class="geom-segment golden-segment" d="M 236.13 220 L 340 220 L 443.87 220" data-ref="/ A E /" data-aliases="/ E A /" fill="none"><title>/ A E /: |seg| = 1/2 + sqrt(5)/2</title></path>
      <path class="geom-segment golden-segment" d="M 364.52 220 L 404.2 220 L 443.87 220" data-ref="/ B E /" data-aliases="/ E B /" fill="none"><title>/ B E /: |seg| = -1/2 + sqrt(5)/2</title></path>
    </g>
