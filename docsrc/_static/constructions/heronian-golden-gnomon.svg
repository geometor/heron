      <circle class="geom-point" cx="364.52" cy="91.61" r="4.3" data-ref="C" data-latex-x="1" data-latex-y="1"><title>C = (1, 1)</title></circle>
      <circle class="geom-point touch-point" cx="300.32" cy="220" r="3.9" data-ref="M" data-latex-x="\frac{1}{2}" data-latex-y="0"><title>M = (1/2, 0)</title></circle>
      <circle class="geom-point incenter-point" cx="443.87" cy="220" r="5" data-ref="E" data-latex-x="\frac{1}{2} + \frac{\sqrt{5}}{2}" data-latex-y="0"><title>E = (1/2 + sqrt(5)/2, 0)</title></circle>
      <circle class="geom-point golden-point" cx="443.87" cy="91.61" r="4.6" data-ref="F" data-latex-x="\frac{1}{2} + \frac{\sqrt{5}}{2}" data-latex-y="1"><title>F = (1/2 + sqrt(5)/2, 1)</title></circle>
      <circle class="geom-point touch-point" cx="443.87" cy="140.65" r="3.9" data-ref="G" data-latex-x="\frac{1}{2} + \frac{\sqrt{5}}{2}" data-latex-y="- \frac{1}{2} + \frac{\sqrt{5}}{2}"><title>G = (1/2 + sqrt(5)/2, -1/2 + sqrt(5)/2)</title></circle>
      <circle class="geom-point touch-point" cx="364.52" cy="140.65" r="3.9" data-ref="H" data-latex-x="1" data-latex-y="- \frac{1}{2} + \frac{\sqrt{5}}{2}"><title>H = (1, -1/2 + sqrt(5)/2)</title></circle>
      <circle class="geom-point" cx="156.78" cy="220" r="3.9" data-ref="E1" data-latex-x="\frac{1}{2} - \frac{\sqrt{5}}{2}" data-latex-y="0"><title>E1 = (1/2 - sqrt(5)/2, 0)</title></circle>
