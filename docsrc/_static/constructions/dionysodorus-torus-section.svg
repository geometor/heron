      <circle class="geom-circle incircle-curve" cx="445.7" cy="220" r="143.55" data-ref="( Z B )" data-aliases="( Z C ) | ( Z D ) | ( Z E ) | ( C B D )" fill="none"><title>( Z B ): y**2 + (x - 14)**2 - 36 = 0</title></circle>
      <path class="geom-line carrier-line" d="M 14 220 L 350 220 L 686 220" data-ref="[ A B ]" data-aliases="[ A C ] | [ C A ] | [ B A ] | [ A Z ] | [ Z A ] | [ C B ] | [ B C ] | [ C Z ] | [ Z C ] | [ B Z ] | [ Z B ]" fill="none"><title>[ A B ]: y = 0</title></path>
      <path class="geom-line carrier-line" d="M 445.7 426 L 445.7 220 L 445.7 14" data-ref="[ D E ]" data-aliases="[ Z D ] | [ D Z ] | [ Z E ] | [ E Z ] | [ E D ]" fill="none"><title>[ D E ]: x - 14 = 0</title></path>
      <path class="geom-line carrier-line" d="M 110.75 426 L 110.75 220 L 110.75 14" data-ref="[ I J ]" data-aliases="[ A H1 ] | [ H1 A ] | [ A H2 ] | [ H2 A ] | [ H1 H2 ] | [ H2 H1 ]" fill="none"><title>[ I J ]: x = 0</title></path>
      <path class="geom-line aux-line" d="M 14 76.45 L 350 76.45 L 686 76.45" data-ref="[ L M ]" data-aliases="[ D H1 ] | [ H1 D ]" fill="none"><title>[ L M ]: y - 6 = 0</title></path>
      <path class="geom-line aux-line" d="M 14 363.55 L 350 363.55 L 686 363.55" data-ref="[ O P ]" data-aliases="[ E H2 ] | [ H2 E ]" fill="none"><title>[ O P ]: y + 6 = 0</title></path>
      <path class="geom-segment golden-segment" d="M 110.75 220 L 278.23 220 L 445.7 220" data-ref="/ A Z /" data-aliases="/ Z A /" fill="none"><title>/ A Z /: |seg| = 14</title></path>
      <path class="geom-segment radius-segment" d="M 445.7 220 L 517.47 220 L 589.25 220" data-ref="/ Z B /" data-aliases="/ B Z /" fill="none"><title>/ Z B /: |seg| = 6</title></path>
    </g>
    <g id="highlights" style="pointer-events: none;"></g>
    <g id="points">
