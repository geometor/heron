<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" width="700" height="440" viewBox="0 0 700 440" data-graphic-id="g1" role="img" aria-label="Hero Metrica II.13 — Dionysodorus Torus Meridian Section (R = 14, r = 6)">
  <title>Hero Metrica II.13 — Dionysodorus Torus Meridian Section (R = 14, r = 6)</title>
  <defs>
