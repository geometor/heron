      <circle class="geom-point" cx="302.15" cy="220" r="4.3" data-ref="C" data-latex-x="8" data-latex-y="0"><title>C = (8, 0)</title></circle>
      <circle class="geom-point" cx="589.25" cy="220" r="4.3" data-ref="B" data-latex-x="20" data-latex-y="0"><title>B = (20, 0)</title></circle>
      <circle class="geom-point incenter-point" cx="445.7" cy="220" r="5" data-ref="Z" data-latex-x="14" data-latex-y="0"><title>Z = (14, 0)</title></circle>
      <circle class="geom-point touch-point" cx="445.7" cy="76.45" r="3.9" data-ref="D" data-latex-x="14" data-latex-y="6"><title>D = (14, 6)</title></circle>
      <circle class="geom-point touch-point" cx="445.7" cy="363.55" r="3.9" data-ref="E" data-latex-x="14" data-latex-y="-6"><title>E = (14, -6)</title></circle>
      <circle class="geom-point meet-point" cx="110.75" cy="76.45" r="4.2" data-ref="H1" data-latex-x="0" data-latex-y="6"><title>H1 = (0, 6)</title></circle>
      <circle class="geom-point meet-point" cx="110.75" cy="363.55" r="4.2" data-ref="H2" data-latex-x="0" data-latex-y="-6"><title>H2 = (0, -6)</title></circle>
    </g>
