[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geometor-heron"
dynamic = ["version"]
authors = [
  { name = "phi ARCHITECT", email = "github@phiarchitect.com" },
]
description = "Hero of Alexandria's Metrica, Definitiones, Catoptrica, and Dioptra: 4-Track Bilingual Book Codex and Exact Symbolic Constructions"
readme = "README.rst"
requires-python = ">=3.13"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "sympy",
  "rich",
  "geometor-model",
  "geometor-divine",
]

[project.scripts]
heron = "geometor.heron.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "geometor.heron.__version__" }

[project.urls]
"Website" = "https://geometor.github.io/heron"
"Repository" = "https://github.com/geometor/heron"
"Issues" = "https://github.com/geometor/heron/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"demos/**" = ["ANN", "D"]
