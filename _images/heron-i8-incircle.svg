      --bisector: #2dd4bf;
      --aux: #94a3b8;
      --golden: #facc15;
      --tangent: #38bdf8;
      --radius-col: #34d399;
      --pt-given: #f1f5f9;
      --pt-incenter: #fbbf24;
      --pt-touch: #38bdf8;
      --pt-meet: #c084fc;
    }
